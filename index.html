<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Енотов Ежедневник</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #000000);
      --hint: var(--tg-theme-hint-color, #999999);
      --link: var(--tg-theme-link-color, #2481cc);
      --button: var(--tg-theme-button-color, #2481cc);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #f5f5f5);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      overscroll-behavior: none;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .hidden { display: none !important; }
    
    /* Header */
    .header {
      padding: 12px 16px;
      background: var(--bg);
      border-bottom: 1px solid rgba(0,0,0,0.05);
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-left h1 { font-size: 20px; font-weight: 700; }
    .header-right {
      display: flex;
      gap: 8px;
    }
    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--secondary-bg);
      border: none;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .week-nav {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }
    .week-nav button {
      background: var(--secondary-bg);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 18px;
      color: var(--text);
      cursor: pointer;
    }
    .week-nav span { font-size: 14px; color: var(--hint); flex: 1; text-align: center; }
    
    /* Tabs */
    .tabs {
      display: flex;
      background: var(--bg);
      border-bottom: 1px solid rgba(0,0,0,0.05);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: 1;
      min-width: 60px;
      padding: 12px 8px;
      text-align: center;
      font-size: 13px;
      color: var(--hint);
      border: none;
      background: none;
      cursor: pointer;
      position: relative;
      white-space: nowrap;
    }
    .tab.active { color: var(--link); font-weight: 600; }
    .tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 20%;
      right: 20%;
      height: 2px;
      background: var(--link);
      border-radius: 1px;
    }
    .tab .progress { font-size: 11px; display: block; margin-top: 2px; }
    
    /* Content */
    .content { flex: 1; overflow-y: auto; padding: 16px; }
    
    /* Progress ring */
    .progress-section {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      padding: 16px;
      background: var(--secondary-bg);
      border-radius: 16px;
    }
    .ring {
      width: 80px;
      height: 80px;
      position: relative;
    }
    .ring svg { transform: rotate(-90deg); }
    .ring-bg { fill: none; stroke: rgba(0,0,0,0.08); stroke-width: 8; }
    .ring-fill { fill: none; stroke: var(--link); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 0.5s; }
    .ring-text {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
    }
    .progress-info h3 { font-size: 16px; font-weight: 600; }
    .progress-info p { font-size: 13px; color: var(--hint); margin-top: 4px; }
    
    /* Tasks */
    .section-title {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--hint);
      margin: 20px 0 12px;
      letter-spacing: 0.5px;
    }
    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: var(--secondary-bg);
      border-radius: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .task-item:active { transform: scale(0.98); }
    .task-checkbox {
      width: 24px;
      height: 24px;
      border: 2px solid var(--hint);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .task-item.done .task-checkbox {
      background: var(--link);
      border-color: var(--link);
    }
    .task-item.done .task-checkbox::after {
      content: '✓';
      color: white;
      font-size: 14px;
      font-weight: 700;
    }
    .task-text { flex: 1; font-size: 15px; }
    .task-item.done .task-text { text-decoration: line-through; color: var(--hint); }
    .task-category {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(36,129,204,0.1);
      color: var(--link);
      text-transform: uppercase;
      font-weight: 600;
    }
    
    /* FAB */
    .fab {
      position: fixed;
      bottom: 80px;
      right: 24px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--button);
      color: var(--button-text);
      border: none;
      font-size: 28px;
      font-weight: 300;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(36,129,204,0.4);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .fab:active { transform: scale(0.95); }
    
    /* Bottom nav */
    .bottom-nav {
      display: flex;
      background: var(--bg);
      border-top: 1px solid rgba(0,0,0,0.05);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-item {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 11px;
      color: var(--hint);
      border: none;
      background: none;
      cursor: pointer;
    }
    .nav-item.active { color: var(--link); }
    .nav-item .icon { font-size: 22px; display: block; margin-bottom: 2px; }
    
    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 300;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: all; }
    .modal-sheet {
      background: var(--bg);
      border-radius: 20px 20px 0 0;
      padding: 20px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.3s;
    }
    .modal-overlay.active .modal-sheet { transform: translateY(0); }
    .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; font-size: 13px; color: var(--hint); margin-bottom: 6px; }
    .input-group input, .input-group select, .input-group textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 12px;
      background: var(--secondary-bg);
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
    }
    .input-group textarea { min-height: 80px; resize: vertical; }
    .input-group input[type="time"] { padding: 10px 16px; }
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--button);
      color: var(--button-text);
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-primary:active { opacity: 0.9; }
    .btn-secondary {
      width: 100%;
      padding: 14px;
      background: var(--secondary-bg);
      color: var(--text);
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    
    /* Journal */
    .journal-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .journal-card {
      background: var(--secondary-bg);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
    }
    .journal-card .value { font-size: 28px; font-weight: 700; color: var(--link); }
    .journal-card .label { font-size: 12px; color: var(--hint); margin-top: 4px; }
    .journal-input {
      background: var(--secondary-bg);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .journal-input label { font-size: 13px; color: var(--hint); display: block; margin-bottom: 8px; }
    .journal-input input[type="number"] {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 24px;
      font-weight: 700;
      text-align: center;
    }
    .journal-input textarea {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      resize: none;
      min-height: 60px;
    }
    
    /* Analytics */
    .stat-card {
      background: var(--secondary-bg);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stat-card .label { font-size: 14px; color: var(--hint); }
    .stat-card .value { font-size: 20px; font-weight: 700; }
    
    /* Settings */
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background: var(--secondary-bg);
      border-radius: 12px;
      margin-bottom: 12px;
    }
    .setting-row .label { font-size: 15px; }
    .setting-row .value { font-size: 14px; color: var(--hint); }
    
    /* Empty state */
    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--hint);
    }
    .empty .icon { font-size: 48px; margin-bottom: 12px; }
    .empty p { font-size: 15px; }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <h1>🦝 Енотов Ежедневник</h1>
      <div class="week-nav">
        <button onclick="changeWeek(-1)">←</button>
        <span id="weekLabel">Неделя 30, 2026</span>
        <button onclick="changeWeek(1)">→</button>
      </div>
    </div>
    <div class="header-right">
      <button class="icon-btn" onclick="openSettings()" title="Настройки">⚙️</button>
    </div>
  </div>

  <!-- Day Tabs -->
  <div class="tabs" id="daysTabs"></div>

  <!-- Content -->
  <div class="content" id="content"></div>

  <!-- FAB -->
  <button class="fab" id="fab" onclick="openAddTask()">+</button>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <button class="nav-item active" onclick="setScreen('day')">
      <span class="icon">📋</span>
      День
    </button>
    <button class="nav-item" onclick="setScreen('week')">
      <span class="icon">📅</span>
      Неделя
    </button>
    <button class="nav-item" onclick="setScreen('journal')">
      <span class="icon">📝</span>
      Дневник
    </button>
    <button class="nav-item" onclick="setScreen('stats')">
      <span class="icon">📊</span>
      Аналитика
    </button>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal" onclick="closeModal(event)">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    // ===== CONFIG =====
    const CONFIG = {
      SUPABASE_URL: 'https://rayhnludfxhzeaacjfco.supabase.co',
      SUPABASE_ANON_KEY: 'sb_publishable_w_tY_r2JHCJ9P0i8vn35Tg_rPO0EPoI'
    };

    // ===== TELEGRAM =====
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.setHeaderColor(tg.themeParams.bg_color);
    tg.setBackgroundColor(tg.themeParams.bg_color);

    const user = tg.initDataUnsafe?.user;
    const telegramId = user?.id;
    const firstName = user?.first_name || 'Друг';
    const username = user?.username || '';

    if (!telegramId) {
      tg.showAlert('Ошибка: не удалось получить ID из Telegram. Откройте через бота @Raccoons_Diary_bot');
    }

    // ===== STATE =====
    let currentWeek = getWeekNumber(new Date());
    let currentYear = new Date().getFullYear();
    let selectedDay = new Date().getDay();
    let currentScreen = 'day';
    let tasks = {};
    let journalData = {};
    let userSettings = {};

    const dayNames = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
    const fullDayNames = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];

    // ===== HELPERS =====
    function getWeekNumber(d) {
      d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    }

    function getDateOfISOWeek(w, y) {
      const simple = new Date(y, 0, 1 + (w - 1) * 7);
      const dow = simple.getDay();
      const ISOweekStart = simple;
      if (dow <= 4) ISOweekStart.setDate(simple.getDate() - simple.getDay() + 1);
      else ISOweekStart.setDate(simple.getDate() + 8 - simple.getDay());
      return ISOweekStart;
    }

    function formatDate(d) {
      return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
    }

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ===== SUPABASE API =====
    async function supabaseRequest(table, method, body, query) {
      let url = `${CONFIG.SUPABASE_URL}/rest/v1/${table}`;
      if (query) url += '?' + query;
      const opts = {
        method,
        headers: {
          'apikey': CONFIG.SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${CONFIG.SUPABASE_ANON_KEY}`,
          'Content-Type': 'application/json'
        }
      };
      if (body) opts.body = JSON.stringify(body);
      if (method === 'POST' || method === 'PATCH') {
        opts.headers['Prefer'] = 'resolution=merge-duplicates';
      }
      const res = await fetch(url, opts);
      if (!res.ok) {
        const err = await res.text();
        console.error('Supabase error:', err);
        throw new Error(err);
      }
      return res.status === 204 ? null : await res.json();
    }

    // ===== LOAD DATA =====
    async function loadData() {
      if (!telegramId) return;

      // Local cache first
      const cached = localStorage.getItem(`enot_${telegramId}`);
      if (cached) {
        const data = JSON.parse(cached);
        tasks = data.tasks || {};
        journalData = data.journal || {};
        userSettings = data.settings || {};
      }

      // Create/update user in Supabase
      try {
        await supabaseRequest('users', 'POST', {
          telegram_id: telegramId,
          username: username,
          first_name: firstName
        });
      } catch (e) {
        // User already exists — ok
      }

      // Load settings
      try {
        const settings = await supabaseRequest('users', 'GET', null, `telegram_id=eq.${telegramId}`);
        if (settings && settings[0]) {
          userSettings = settings[0];
        }
      } catch (e) {}

      // Sync from Supabase
      try {
        await syncFromServer();
      } catch (e) {
        console.error('Sync error:', e);
      }

      render();
    }

    async function syncFromServer() {
      if (!telegramId) return;

      // Load tasks
      const tasksData = await supabaseRequest(
        'tasks',
        'GET',
        null,
        `telegram_id=eq.${telegramId}&week=eq.${currentWeek}&year=eq.${currentYear}`
      );

      if (tasksData) {
        tasks[currentWeek] = tasks[currentWeek] || {};
        for (let d = 0; d < 7; d++) tasks[currentWeek][d] = [];
        
        tasksData.forEach(t => {
          if (!tasks[currentWeek][t.day]) tasks[currentWeek][t.day] = [];
          tasks[currentWeek][t.day].push({
            id: t.id,
            text: t.text,
            done: t.done,
            category: t.category,
            type: t.type
          });
        });
      }

      // Load journal
      const today = new Date().toISOString().split('T')[0];
      const journalRes = await supabaseRequest(
        'journal',
        'GET',
        null,
        `telegram_id=eq.${telegramId}&date=eq.${today}`
      );

      if (journalRes && journalRes[0]) {
        journalData[today] = journalRes[0];
      }

      saveLocal();
    }

    function saveLocal() {
      localStorage.setItem(`enot_${telegramId}`, JSON.stringify({ 
        tasks, 
        journal: journalData,
        settings: userSettings 
      }));
    }

    // ===== SAVE TO SERVER =====
    async function saveTask(task) {
      if (!telegramId) return;

      await supabaseRequest('tasks', 'POST', {
        id: task.id,
        telegram_id: telegramId,
        text: task.text,
        category: task.category,
        type: task.type,
        days: JSON.stringify(task.days || [selectedDay]),
        week: currentWeek,
        year: currentYear,
        day: selectedDay,
        done: task.done || false
      });

      tg.HapticFeedback?.impactOccurred('light');
    }

    async function toggleTask(taskId, done) {
      if (!telegramId) return;

      await supabaseRequest(
        'tasks',
        'PATCH',
        { done },
        `id=eq.${taskId}`
      );

      tg.HapticFeedback?.impactOccurred('medium');
    }

    async function deleteTask(taskId) {
      if (!telegramId) return;
      await supabaseRequest('tasks', 'DELETE', null, `id=eq.${taskId}`);
    }

    async function saveJournal(entry) {
      if (!telegramId) return;

      const today = new Date().toISOString().split('T')[0];
      await supabaseRequest('journal', 'POST', {
        id: generateId(),
        telegram_id: telegramId,
        date: today,
        sleep: entry.sleep,
        energy: entry.energy,
        mood: entry.mood,
        lesson: entry.lesson,
        gratitude: entry.gratitude,
        notes: entry.notes,
        week: currentWeek,
        year: currentYear
      });

      journalData[today] = entry;
      saveLocal();
      tg.HapticFeedback?.impactOccurred('light');
    }

    async function saveSettings(settings) {
      if (!telegramId) return;

      await supabaseRequest(
        'users',
        'PATCH',
        settings,
        `telegram_id=eq.${telegramId}`
      );

      Object.assign(userSettings, settings);
      saveLocal();
      tg.showPopup({ title: 'Сохранено!', message: 'Настройки обновлены' });
    }

    // ===== RENDER =====
    function render() {
      renderTabs();
      renderContent();
      updateWeekLabel();
    }

    function renderTabs() {
      const container = document.getElementById('daysTabs');
      const weekStart = getDateOfISOWeek(currentWeek, currentYear);
      
      container.innerHTML = '';
      for (let i = 0; i < 7; i++) {
        const d = new Date(weekStart);
        d.setDate(d.getDate() + i);
        const dayNum = i === 6 ? 0 : i + 1;
        const isToday = dayNum === selectedDay;
        const dayTasks = (tasks[currentWeek]?.[dayNum] || []).filter(t => !t.done);
        const totalTasks = (tasks[currentWeek]?.[dayNum] || []).length;
        const progress = totalTasks > 0 ? Math.round(((totalTasks - dayTasks.length) / totalTasks) * 100) : 0;

        const btn = document.createElement('button');
        btn.className = 'tab' + (isToday ? ' active' : '');
        btn.innerHTML = `
          ${dayNames[dayNum]}
          <span class="progress">${progress}%</span>
        `;
        btn.onclick = () => { selectedDay = dayNum; render(); };
        container.appendChild(btn);
      }
    }

    function updateWeekLabel() {
      const weekStart = getDateOfISOWeek(currentWeek, currentYear);
      const weekEnd = new Date(weekStart);
      weekEnd.setDate(weekEnd.getDate() + 6);
      document.getElementById('weekLabel').textContent =
        `Неделя ${currentWeek}, ${formatDate(weekStart)} — ${formatDate(weekEnd)}`;
    }

    function renderContent() {
      const content = document.getElementById('content');
      content.innerHTML = '';

      if (currentScreen === 'day') renderDay(content);
      else if (currentScreen === 'week') renderWeek(content);
      else if (currentScreen === 'journal') renderJournal(content);
      else if (currentScreen === 'stats') renderStats(content);
    }

    function renderDay(container) {
      const dayTasks = tasks[currentWeek]?.[selectedDay] || [];
      const doneCount = dayTasks.filter(t => t.done).length;
      const totalCount = dayTasks.length;
      const percent = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;

      const circumference = 2 * Math.PI * 36;
      const offset = circumference - (percent / 100) * circumference;

      container.innerHTML = `
        <div class="progress-section">
          <div class="ring">
            <svg width="80" height="80" viewBox="0 0 80 80">
              <circle class="ring-bg" cx="40" cy="40" r="36"/>
              <circle class="ring-fill" cx="40" cy="40" r="36"
                stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"/>
            </svg>
            <div class="ring-text">${percent}%</div>
          </div>
          <div class="progress-info">
            <h3>${fullDayNames[selectedDay]}</h3>
            <p>${doneCount} из ${totalCount} выполнено</p>
          </div>
        </div>
      `;

      if (dayTasks.length === 0) {
        container.innerHTML += `
          <div class="empty">
            <div class="icon">📝</div>
            <p>Нет задач на сегодня.<br>Нажми + чтобы добавить!</p>
          </div>
        `;
        return;
      }

      container.innerHTML += `<div class="section-title">Задачи</div>`;

      dayTasks.forEach(task => {
        const div = document.createElement('div');
        div.className = 'task-item' + (task.done ? ' done' : '');
        div.innerHTML = `
          <div class="task-checkbox" onclick="event.stopPropagation(); toggleTaskLocal('${task.id}')"></div>
          <div class="task-text">${escapeHtml(task.text)}</div>
          <div class="task-category">${task.category}</div>
        `;
        div.onclick = () => openEditTask(task);
        container.appendChild(div);
      });
    }

    function renderWeek(container) {
      const weekStart = getDateOfISOWeek(currentWeek, currentYear);
      
      for (let i = 0; i < 7; i++) {
        const dayNum = i === 6 ? 0 : i + 1;
        const d = new Date(weekStart);
        d.setDate(d.getDate() + i);
        const dayTasks = tasks[currentWeek]?.[dayNum] || [];
        const doneCount = dayTasks.filter(t => t.done).length;
        const totalCount = dayTasks.length;
        const percent = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;

        const card = document.createElement('div');
        card.className = 'task-item';
        card.style.cursor = 'pointer';
        card.innerHTML = `
          <div style="flex:1">
            <div style="font-weight:600">${fullDayNames[dayNum]}</div>
            <div style="font-size:13px;color:var(--hint)">${formatDate(d)} · ${doneCount}/${totalTasks}</div>
          </div>
          <div style="font-size:18px;font-weight:700;color:var(--link)">${percent}%</div>
        `;
        card.onclick = () => { selectedDay = dayNum; setScreen('day'); };
        container.appendChild(card);
      }
    }

    function renderJournal(container) {
      const today = new Date().toISOString().split('T')[0];
      const entry = journalData[today] || {};

      container.innerHTML = `
        <div class="section-title">Сегодня, ${formatDate(new Date())}</div>
        
        <div class="journal-grid">
          <div class="journal-card" onclick="editJournalValue('sleep', 'Сон (часы)', 0, 12)">
            <div class="value">${entry.sleep ?? '-'}</div>
            <div class="label">😴 Сон</div>
          </div>
          <div class="journal-card" onclick="editJournalValue('energy', 'Энергия', 1, 10)">
            <div class="value">${entry.energy ?? '-'}</div>
            <div class="label">⚡ Энергия</div>
          </div>
          <div class="journal-card" onclick="editJournalValue('mood', 'Настроение', 1, 10)">
            <div class="value">${entry.mood ?? '-'}</div>
            <div class="label">😊 Настроение</div>
          </div>
        </div>

        <div class="journal-input">
          <label>💡 Урок дня</label>
          <textarea id="jLesson" placeholder="Чему научился сегодня?">${entry.lesson || ''}</textarea>
        </div>
        <div class="journal-input">
          <label>🙏 За что благодарен</label>
          <textarea id="jGratitude" placeholder="За что thankful?">${entry.gratitude || ''}</textarea>
        </div>
        <div class="journal-input">
          <label>📝 Заметки</label>
          <textarea id="jNotes" placeholder="Мысли, идеи...">${entry.notes || ''}</textarea>
        </div>

        <button class="btn-primary" onclick="saveJournalEntry()">💾 Сохранить дневник</button>
      `;
    }

    function renderStats(container) {
      let totalTasks = 0, doneTasks = 0, totalSleep = 0, sleepCount = 0;
      const categoryStats = {};

      Object.values(tasks).forEach(week => {
        Object.values(week).forEach(day => {
          day.forEach(t => {
            totalTasks++;
            if (t.done) doneTasks++;
            categoryStats[t.category] = (categoryStats[t.category] || 0) + 1;
          });
        });
      });

      Object.values(journalData).forEach(j => {
        if (j.sleep) { totalSleep += j.sleep; sleepCount++; }
      });

      const avgSleep = sleepCount > 0 ? (totalSleep / sleepCount).toFixed(1) : '-';
      const completionRate = totalTasks > 0 ? Math.round((doneTasks / totalTasks) * 100) : 0;

      container.innerHTML = `
        <div class="section-title">Общая статистика</div>
        
        <div class="stat-card">
          <div class="label">📋 Всего задач</div>
          <div class="value">${totalTasks}</div>
        </div>
        <div class="stat-card">
          <div class="label">✅ Выполнено</div>
          <div class="value">${doneTasks} (${completionRate}%)</div>
        </div>
        <div class="stat-card">
          <div class="label">😴 Средний сон</div>
          <div class="value">${avgSleep} ч</div>
        </div>

        <div class="section-title">По категориям</div>
        ${Object.entries(categoryStats).map(([cat, count]) => `
          <div class="stat-card">
            <div class="label">${cat}</div>
            <div class="value">${count}</div>
          </div>
        `).join('') || '<div class="empty"><p>Нет данных</p></div>'}
      `;
    }

    // ===== ACTIONS =====
    function setScreen(screen) {
      currentScreen = screen;
      document.querySelectorAll('.nav-item').forEach((el, i) => {
        el.classList.toggle('active', 
          (screen === 'day' && i === 0) ||
          (screen === 'week' && i === 1) ||
          (screen === 'journal' && i === 2) ||
          (screen === 'stats' && i === 3)
        );
      });
      document.getElementById('fab').style.display = screen === 'day' ? 'flex' : 'none';
      renderContent();
    }

    function changeWeek(delta) {
      currentWeek += delta;
      if (currentWeek < 1) { currentWeek = 52; currentYear--; }
      if (currentWeek > 52) { currentWeek = 1; currentYear++; }
      loadData();
    }

    function toggleTaskLocal(taskId) {
      const dayTasks = tasks[currentWeek]?.[selectedDay] || [];
      const task = dayTasks.find(t => t.id === taskId);
      if (!task) return;

      task.done = !task.done;
      saveLocal();
      toggleTask(taskId, task.done);
      render();
    }

    // ===== MODALS =====
    function openModal(html) {
      document.getElementById('modalContent').innerHTML = html;
      document.getElementById('modal').classList.add('active');
    }

    function closeModal(e) {
      if (e.target === e.currentTarget) {
        document.getElementById('modal').classList.remove('active');
      }
    }

    function openAddTask() {
      openModal(`
        <div class="modal-title">➕ Новая задача</div>
        <div class="input-group">
          <label>Название</label>
          <input type="text" id="taskText" placeholder="Что нужно сделать?">
        </div>
        <div class="input-group">
          <label>Категория</label>
          <select id="taskCategory">
            <option value="work">💼 Работа</option>
            <option value="health">💪 Здоровье</option>
            <option value="study">📚 Учёба</option>
            <option value="hobby">🎨 Хобби</option>
            <option value="other">📌 Другое</option>
          </select>
        </div>
        <div class="input-group">
          <label>Тип</label>
          <select id="taskType">
            <option value="daily">📅 Ежедневная</option>
            <option value="weekly">📆 Еженедельная</option>
            <option value="once">🔔 Разовая</option>
          </select>
        </div>
        <button class="btn-primary" onclick="addTask()">Добавить</button>
      `);
      setTimeout(() => document.getElementById('taskText')?.focus(), 100);
    }

    function openEditTask(task) {
      openModal(`
        <div class="modal-title">✏️ Редактировать</div>
        <div class="input-group">
          <label>Название</label>
          <input type="text" id="editText" value="${escapeHtml(task.text)}">
        </div>
        <button class="btn-primary" onclick="updateTask('${task.id}')" style="margin-bottom:8px">Сохранить</button>
        <button class="btn-primary" onclick="removeTask('${task.id}')" style="background:#ff4444">🗑 Удалить</button>
      `);
    }

    function openSettings() {
      const morning = userSettings.notify_morning || '08:00';
      const evening = userSettings.notify_evening || '21:00';

      openModal(`
        <div class="modal-title">⚙️ Настройки</div>
        
        <div class="section-title">🔔 Уведомления</div>
        <div class="setting-row">
          <div class="label">🌅 Утренние</div>
          <input type="time" id="setMorning" value="${morning}" style="border:none;background:transparent;font-size:16px;">
        </div>
        <div class="setting-row">
          <div class="label">🌙 Вечерние</div>
          <input type="time" id="setEvening" value="${evening}" style="border:none;background:transparent;font-size:16px;">
        </div>
        <button class="btn-primary" onclick="saveNotificationSettings()">💾 Сохранить время</button>
        
        <div class="section-title" style="margin-top:24px">💾 Данные</div>
        <button class="btn-secondary" onclick="exportData()">📤 Экспорт JSON</button>
        <button class="btn-secondary" onclick="importDataPrompt()">📥 Импорт JSON</button>
      `);
    }

    function editJournalValue(field, label, min, max) {
      const today = new Date().toISOString().split('T')[0];
      const entry = journalData[today] || {};
      
      openModal(`
        <div class="modal-title">${label}</div>
        <div class="input-group">
          <input type="number" id="jVal" value="${entry[field] || ''}" min="${min}" max="${max}" 
            style="font-size:48px;text-align:center;padding:20px;">
        </div>
        <button class="btn-primary" onclick="setJournalValue('${field}')">Сохранить</button>
      `);
    }

    // ===== CRUD =====
    async function addTask() {
      const text = document.getElementById('taskText').value.trim();
      const category = document.getElementById('taskCategory').value;
      const type = document.getElementById('taskType').value;
      if (!text) return;

      const task = {
        id: generateId(),
        text,
        category,
        type,
        done: false,
        days: [selectedDay]
      };

      if (!tasks[currentWeek]) tasks[currentWeek] = {};
      if (!tasks[currentWeek][selectedDay]) tasks[currentWeek][selectedDay] = [];
      tasks[currentWeek][selectedDay].push(task);

      saveLocal();
      await saveTask(task);
      
      document.getElementById('modal').classList.remove('active');
      render();
    }

    async function updateTask(taskId) {
      const text = document.getElementById('editText').value.trim();
      if (!text) return;

      const dayTasks = tasks[currentWeek]?.[selectedDay] || [];
      const task = dayTasks.find(t => t.id === taskId);
      if (task) task.text = text;

      saveLocal();
      await supabaseRequest('tasks', 'PATCH', { text }, `id=eq.${taskId}`);

      document.getElementById('modal').classList.remove('active');
      render();
    }

    async function removeTask(taskId) {
      const dayTasks = tasks[currentWeek]?.[selectedDay] || [];
      tasks[currentWeek][selectedDay] = dayTasks.filter(t => t.id !== taskId);

      saveLocal();
      await deleteTask(taskId);

      document.getElementById('modal').classList.remove('active');
      render();
    }

    async function saveJournalEntry() {
      const entry = {
        sleep: parseInt(document.getElementById('jSleep')?.value) || journalData[new Date().toISOString().split('T')[0]]?.sleep || null,
        energy: parseInt(document.getElementById('jEnergy')?.value) || journalData[new Date().toISOString().split('T')[0]]?.energy || null,
        mood: parseInt(document.getElementById('jMood')?.value) || journalData[new Date().toISOString().split('T')[0]]?.mood || null,
        lesson: document.getElementById('jLesson')?.value || '',
        gratitude: document.getElementById('jGratitude')?.value || '',
        notes: document.getElementById('jNotes')?.value || ''
      };

      await saveJournal(entry);
      tg.showPopup({ title: 'Сохранено!', message: 'Дневник обновлён' });
    }

    function setJournalValue(field) {
      const val = parseInt(document.getElementById('jVal').value);
      const today = new Date().toISOString().split('T')[0];
      if (!journalData[today]) journalData[today] = {};
      journalData[today][field] = val;
      document.getElementById('modal').classList.remove('active');
      renderContent();
    }

    async function saveNotificationSettings() {
      const morning = document.getElementById('setMorning').value;
      const evening = document.getElementById('setEvening').value;
      
      await saveSettings({
        notify_morning: morning,
        notify_evening: evening
      });
      
      document.getElementById('modal').classList.remove('active');
    }

    // ===== EXPORT / IMPORT =====
    function exportData() {
      const data = {
        tasks,
        journal: journalData,
        settings: userSettings,
        exportedAt: new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `enot-backup-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
      tg.showPopup({ title: 'Готово!', message: 'Бэкап скачан' });
    }

    function importDataPrompt() {
      openModal(`
        <div class="modal-title">📥 Импорт</div>
        <div class="input-group">
          <label>Вставь JSON</label>
          <textarea id="importJson" placeholder='{"tasks":{...},"journal":{...}}' style="min-height:150px;font-family:monospace;font-size:12px;"></textarea>
        </div>
        <button class="btn-primary" onclick="importData()">📥 Загрузить</button>
      `);
    }

    async function importData() {
      try {
        const json = document.getElementById('importJson').value;
        const data = JSON.parse(json);
        
        if (data.tasks) tasks = data.tasks;
        if (data.journal) journalData = data.journal;
        if (data.settings) userSettings = data.settings;
        
        saveLocal();
        
        // Sync to server
        for (const week of Object.values(tasks)) {
          for (const day of Object.values(week)) {
            for (const task of day) {
              await saveTask(task);
            }
          }
        }
        
        document.getElementById('modal').classList.remove('active');
        render();
        tg.showPopup({ title: 'Готово!', message: 'Данные импортированы' });
      } catch (e) {
        tg.showAlert('Ошибка: неверный формат JSON');
      }
    }

    // ===== INIT =====
    document.addEventListener('DOMContentLoaded', () => {
      if (telegramId) {
        loadData();
      } else {
        document.getElementById('content').innerHTML = `
          <div class="empty">
            <div class="icon">⚠️</div>
            <p>Откройте приложение через бота<br>@Raccoons_Diary_bot</p>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
